name: Vaultwarden Deploy

run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - "vaultwarden/**"

permissions:
  contents: read
  id-token: write

jobs:
  summary:
    name: Image version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show image version diff
        run: |
          # Diff against the last *approved* deploy, not just the previous
          # commit: a rejected run doesn't revert its commit off main, so
          # HEAD^ would hide changes (e.g. a rejected caddy bump) that a
          # later approved run's `git pull --ff-only` deploys anyway.
          if git rev-parse -q --verify refs/tags/vaultwarden-last-deploy >/dev/null; then
            base=refs/tags/vaultwarden-last-deploy
          else
            base=HEAD^
          fi
          diff_output=$(git diff "$base" HEAD -- vaultwarden/docker-compose.yml | grep '^[+-].*image:' || true)
          if [ -n "$diff_output" ]; then
            {
              echo "### Image Changes"
              echo '```diff'
              echo "$diff_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: summary
    runs-on: ubuntu-latest
    # Same "production" Environment terraform-apply.yml uses - a merged
    # version bump only reaches the VM once a human approves this run here.
    # Requires the required-reviewers rule already configured for that
    # Environment in repo Settings.
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy over IAP tunnel
        run: |
          gcloud compute ssh vaultwarden \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --zone=asia-northeast1-b \
            --tunnel-through-iap \
            --quiet \
            --command='sudo bash -c "cd /opt/vaultwarden/app && git pull --ff-only && cd vaultwarden && docker compose --env-file /opt/vaultwarden/.env pull && docker compose --env-file /opt/vaultwarden/.env up -d"'
          # No `|| echo WARNING` fallback here (unlike the startup-script's
          # boot-time git pull): a deploy run's whole point is a legible
          # pass/fail signal in the Actions UI, so a pull failure must fail
          # the job rather than being silently swallowed.

      - name: Mark commit as deployed
        run: |
          git tag -f vaultwarden-last-deploy
          git push -f origin vaultwarden-last-deploy
