name: Vaultwarden Deploy

run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - "vaultwarden/**"

permissions:
  contents: read
  id-token: write

jobs:
  summary:
    name: Image version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show image version diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Diff against the last *approved* deploy, not just the previous
          # commit: a rejected run doesn't revert its commit off main, so
          # HEAD^ would hide changes (e.g. a rejected caddy bump) that a
          # later approved run's `git pull --ff-only` deploys anyway.
          # "Approved" = the latest run of this workflow that finished
          # successfully. It is read from run history rather than a pushed
          # tag: GITHUB_TOKEN cannot move a tag across commits that touch
          # .github/workflows (it has no `workflows` permission).
          base=$(gh run list --workflow vaultwarden-deploy.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD^
          fi
          diff_output=$(git diff "$base" HEAD -- vaultwarden/docker-compose.yml | grep '^[+-].*image:' || true)
          if [ -n "$diff_output" ]; then
            {
              echo "### Image Changes"
              echo '```diff'
              echo "$diff_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: summary
    runs-on: ubuntu-latest
    # Same "production" Environment terraform-apply.yml uses - a merged
    # version bump only reaches the VM once a human approves this run here.
    # Requires the required-reviewers rule already configured for that
    # Environment in repo Settings.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy over IAP tunnel
        run: |
          gcloud compute ssh vaultwarden \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --zone=asia-northeast1-b \
            --tunnel-through-iap \
            --quiet \
            --command='sudo bash -c "cd /opt/vaultwarden/app && git pull --ff-only && cd vaultwarden && docker compose --env-file /opt/vaultwarden/.env pull && docker compose --env-file /opt/vaultwarden/.env up -d --force-recreate caddy && docker compose --env-file /opt/vaultwarden/.env up -d"'
          # No `|| echo WARNING` fallback here (unlike the startup-script's
          # boot-time git pull): a deploy run's whole point is a legible
          # pass/fail signal in the Actions UI, so a pull failure must fail
          # the job rather than being silently swallowed.
          #
          # `--force-recreate caddy` on every run, unconditionally: Caddyfile
          # is a single-file bind mount (`./Caddyfile:/etc/caddy/Caddyfile:ro`
          # in docker-compose.yml), and `git pull` replaces that file via a
          # new inode rather than editing it in place, so a plain
          # `docker compose up -d` (which only recreates a container when the
          # compose service definition itself changed) leaves an
          # already-running caddy container's bind mount pointing at the old,
          # deleted inode - `caddy reload` doesn't fix this either, since the
          # mount itself, not just Caddy's in-process config, is stale. caddy
          # holds no state of its own, so recreating it unconditionally on
          # every deploy of this workflow (already gated behind a path filter
          # and a manual production-environment approval, so not a hot path)
          # is cheap. The second `up -d` afterwards is the normal, unforced
          # command, so vaultwarden itself is only recreated when its own
          # service definition actually changed (e.g. an image bump) - it
          # holds live user sessions/websockets, so it shouldn't be
          # unconditionally bounced on a Caddyfile-only change the way caddy
          # is.
