services:
  vaultwarden:
    # TEMPORARY test build: custom image from kuchida1981/vaultwarden
    # branch fix/webauthn-registration-uv-preferred (based on the
    # official 1.37.1 tag), which changes WebAuthn 2FA *registration*
    # to request UserVerificationPolicy::Preferred instead of
    # Discouraged. Testing whether this is why a Google Titan Security
    # Key registered via Chrome (no PIN prompt, no UV) can't complete
    # 2FA login afterwards (see vaultwarden-ops issue #67 - traced to
    # UV not being performed at registration; re-registering the same
    # key via Firefox, which prompts for the PIN despite the
    # discouraged hint, already fixes login from both browsers).
    # Revert this line to `vaultwarden/server:1.37.1` (restoring the
    # Dependabot-trackable literal tag noted below) once the test is
    # done either way.
    #
    # Original comment: pinned to a literal tag (not a variable) so
    # Dependabot's docker-compose ecosystem can detect and bump it - it
    # cannot resolve shell/env interpolation.
    image: ghcr.io/kuchida1981/vaultwarden:1.37.1-uv-preferred-fix-amd64
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      # Caddy's reverse_proxy sends X-Forwarded-For by default (not
      # X-Real-IP, which is Vaultwarden's own default expectation) - see
      # the trusted_proxies comment in Caddyfile for why trusting the
      # leftmost value of this header is safe in this topology.
      IP_HEADER: "X-Forwarded-For"
      # Email 2FA is weaker than TOTP/WebAuthn (mailbox itself is an attack
      # target), so it's dropped from the selectable 2FA methods.
      # Note: Duo is intentionally NOT disabled here. _ENABLE_DUO only
      # gates the global (admin-shared) Duo credentials - Vaultwarden lets
      # any user configure their own personal Duo application regardless
      # of this flag (see api/core/two_factor/duo.rs: activate_duo never
      # checks it), so it can't be used to actually remove Duo as an
      # option. Fully blocking it would require rejecting the
      # /api/two-factor/duo* routes at the Caddy layer instead, which was
      # decided against for now.
      _ENABLE_EMAIL_2FA: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    volumes:
      - ${DATA_DIR:-./data}:/data
    networks:
      - internal

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Tailnet-only admin entry point: bound to loopback only, so it's
      # unreachable except via `tailscale serve` on the host forwarding
      # tailnet traffic here (see Caddyfile and startup-script).
      - "127.0.0.1:8080:8080"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - vaultwarden

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
