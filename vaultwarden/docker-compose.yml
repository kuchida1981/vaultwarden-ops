services:
  vaultwarden:
    # Pinned to a literal tag (not a variable) so Dependabot's
    # docker-compose ecosystem can detect and bump it - it cannot resolve
    # shell/env interpolation.
    image: vaultwarden/server:1.37.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      # Email is weaker than TOTP/WebAuthn (mailbox itself is an attack
      # target) and Duo isn't operated on this instance - both are dropped
      # from the selectable 2FA methods, leaving only TOTP and WebAuthn.
      _ENABLE_EMAIL_2FA: "false"
      _ENABLE_DUO: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    volumes:
      - ${DATA_DIR:-./data}:/data
    networks:
      - internal

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Tailnet-only admin entry point: bound to loopback only, so it's
      # unreachable except via `tailscale serve` on the host forwarding
      # tailnet traffic here (see Caddyfile and startup-script).
      - "127.0.0.1:8080:8080"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - vaultwarden

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
