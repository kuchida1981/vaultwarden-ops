services:
  vaultwarden:
    # Pinned to a literal tag (not a variable) so Dependabot's
    # docker-compose ecosystem can detect and bump it - it cannot resolve
    # shell/env interpolation.
    image: vaultwarden/server:1.37.0
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      # Email 2FA is weaker than TOTP/WebAuthn (mailbox itself is an attack
      # target), so it's dropped from the selectable 2FA methods.
      # Note: Duo is intentionally NOT disabled here. _ENABLE_DUO only
      # gates the global (admin-shared) Duo credentials - Vaultwarden lets
      # any user configure their own personal Duo application regardless
      # of this flag (see api/core/two_factor/duo.rs: activate_duo never
      # checks it), so it can't be used to actually remove Duo as an
      # option. Fully blocking it would require rejecting the
      # /api/two-factor/duo* routes at the Caddy layer instead, which was
      # decided against for now.
      _ENABLE_EMAIL_2FA: "false"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    volumes:
      - ${DATA_DIR:-./data}:/data
    networks:
      - internal

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Tailnet-only admin entry point: bound to loopback only, so it's
      # unreachable except via `tailscale serve` on the host forwarding
      # tailnet traffic here (see Caddyfile and startup-script).
      - "127.0.0.1:8080:8080"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - vaultwarden

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
